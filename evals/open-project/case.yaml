schema_version: "1.1"
name: open-project
description: Saying "work on project 1" reports state and backlog, and claims nothing.
tags: [workai-open-project]
runs: 3
execution:
  max_turns: 12
  allowed_tools: [Read, Glob, Grep, Skill, "Bash(python3:*)", "Bash(cd:*)", "Bash(git:*)"]
  prompt: work on project 1
context:
  scaffold_script: scaffold.sh
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: 'workai-open-project'
    arm: with-only
  - name: reports-next-card
    type: regex
    pattern: '002'
    target: last_message
  - name: card-not-claimed
    type: regex
    pattern: 'claimed_by:[ \t]*\n'
    target: {source: file, path: "workai/projects/01-demo/backlog/todo/002-write-intro.md"}
  - name: good-report
    type: llm
    criteria: |
      PASS if the reply names project 01 (Demo), lists claimable cards with
      002 "Write the intro" first, says 003 is blocked (or that one card is
      blocked), and ends by asking what to work on. FAIL if it starts working
      on or claims a card, or reports cards that are not in the backlog.
