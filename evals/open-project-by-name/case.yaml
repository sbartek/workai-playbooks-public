schema_version: "1.1"
name: open-project-by-name
description: Saying "work on project my music" opens hub 03 by name, reports it, and claims nothing.
tags: [workai-open-project]
runs: 3
execution:
  max_turns: 12
  allowed_tools: [Read, Glob, Grep, Skill, "Bash(python3:*)", "Bash(cd:*)", "Bash(git:*)"]
  prompt: work on project my music
context:
  scaffold_script: scaffold.sh
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: 'workai-open-project'
    arm: with-only
  - name: names-hub-03
    type: regex
    pattern: '(?=[\s\S]*\b03\b)(?=[\s\S]*My Music)'
    target: last_message
  - name: card-not-claimed
    type: regex
    pattern: 'claimed_by:[ \t]*\n'
    target: {source: file, path: "workai/projects/03-my-music/backlog/todo/002-rank-festival.md"}
  - name: good-report
    type: llm
    criteria: |
      PASS if the reply opens project 03 (My Music), says card 001 "Tag the
      albums" is in progress and WAITING (a question for the user), offers 002
      "Rank the festival bill" as the claimable card, mentions the
      uncommitted change in the hub, and ends by asking what to work on.
      FAIL if it opens a different project, asks which project was meant,
      starts working on or claims a card, or reports cards that are not in
      the backlog.
