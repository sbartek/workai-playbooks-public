[project]
name = "workai-board"
version = "0.1.0"
description = "Read-only terminal board of every workai project's backlog"
requires-python = ">=3.11"
dependencies = ["textual"]
license = "MIT"

[project.scripts]
workai-board = "workai_board.cli:main"

[dependency-groups]
dev = ["pytest", "pytest-asyncio"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workai_board"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
